<title>1分ASVS V11.4.2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap">
<style>
/* Layout: a 1080x1920 video stage scaled to fit, controls underneath. Single dark look on purpose (matches the rendered video). */
:root {
  color-scheme: dark;
  --bg: #0d1117;
  --panel: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #8b949e;
  --accent: #58a6ff;
  --bad: #f85149;
  --bad-bg: rgba(248, 81, 73, 0.16);
  --good: #3fb950;
  --good-bg: rgba(63, 185, 80, 0.16);
  --warn: #d29922;
  --page: #080b10;
  --font: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  --mono: "JetBrains Mono", Menlo, Consolas, monospace;
}
html, body { height: 100%; }
body {
  background: var(--page);
  color: var(--text);
  font-family: var(--font);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
#frame {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
}
#viewport {
  position: relative;
  aspect-ratio: 9 / 16;
  height: 100%;
  max-width: 100%;
  max-height: 100%;
  overflow: hidden;
  border-radius: 14px;
  box-shadow: 0 0 0 1px var(--border);
}
#stage {
  position: absolute;
  top: 0; left: 0;
  width: 1080px; height: 1920px;
  transform-origin: 0 0;
  background:
    radial-gradient(circle at 80% 10%, rgba(88,166,255,0.15), transparent 45%),
    radial-gradient(circle at 10% 90%, rgba(248,81,73,0.10), transparent 40%),
    var(--bg);
  font-family: var(--font);
  color: var(--text);
  overflow: hidden;
}
.scene {
  position: absolute; inset: 0;
  padding: 260px 70px 420px;
  display: flex; flex-direction: column; justify-content: center; gap: 48px;
  box-sizing: border-box;
}
.progress { position: absolute; top: 0; left: 0; height: 12px; background: var(--accent); }
.header { position: absolute; top: 150px; left: 70px; font-size: 34px; font-weight: 700; color: var(--muted); display: flex; gap: 16px; }
.header b { color: var(--accent); }
.cap { font-size: 64px; font-weight: 800; }
.note { font-size: 44px; font-weight: 700; line-height: 1.5; background: rgba(255,255,255,0.06); border-radius: 20px; padding: 28px 36px; }
.code { background: var(--panel); border: 2px solid var(--border); border-radius: 24px; padding: 36px 0; font-family: var(--mono); font-size: 34px; line-height: 1.6; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
.code div { padding: 0 36px 0 28px; white-space: pre; min-height: 1.6em; border-left: 8px solid transparent; }
.code .bad { background: var(--bad-bg); border-left-color: var(--bad); }
.code .good { background: var(--good-bg); border-left-color: var(--good); }
.kw { color: #ff7b72; } .fn { color: #d2a8ff; } .str { color: #a5d6ff; } .num { color: #79c0ff; } .cm { color: var(--muted); }
.point { font-size: 46px; font-weight: 700; line-height: 1.5; display: flex; gap: 20px; }
.point span:first-child { color: var(--bad); }
.counter { font-family: var(--mono); font-size: 60px; font-weight: 800; color: var(--bad); text-align: center; background: var(--bad-bg); border-radius: 20px; padding: 24px 0; font-variant-numeric: tabular-nums; }
.req-id { display: flex; align-items: center; gap: 28px; transform-origin: left center; }
.req-id .id { font-family: var(--mono); font-size: 110px; font-weight: 800; color: var(--accent); }
.req-id .lv { font-size: 48px; font-weight: 800; background: var(--accent); color: var(--bg); border-radius: 16px; padding: 6px 22px; }
.check { font-size: 46px; font-weight: 700; display: flex; gap: 24px; align-items: center; background: var(--panel); border: 2px solid var(--border); border-radius: 20px; padding: 26px 32px; }
.check span:first-child { color: var(--good); font-size: 52px; }
.choice { font-size: 52px; font-weight: 800; padding: 26px 36px; border-radius: 20px; border: 4px solid var(--border); background: var(--panel); }
.choice.hit { border-color: var(--bad); background: var(--bad-bg); }
.choice.dim { opacity: 0.35 !important; }

#controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; width: 100%; max-width: 560px; }
#controls button {
  font: 700 14px var(--font); color: var(--text); background: var(--panel);
  border: 1px solid var(--border); border-radius: 999px; padding: 8px 16px; cursor: pointer;
}
#controls button:hover { border-color: var(--accent); }
#controls button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#seek { flex: 1 1 200px; min-width: 0; accent-color: var(--accent); }
#time { font: 500 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
#chapters { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 560px; }
#chapters button { font: 500 12px var(--font); color: var(--muted); background: transparent; border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; cursor: pointer; }
#chapters button.on { color: var(--bg); background: var(--accent); border-color: var(--accent); }
</style>

<div id="frame"><div id="viewport"><div id="stage"></div></div></div>
<div id="controls">
  <button id="play" type="button">⏸ 一時停止</button>
  <button id="restart" type="button">↺ 最初から</button>
  <input id="seek" type="range" min="0" max="1529" value="0" aria-label="再生位置">
  <span id="time">0.0 / 51.0 秒</span>
</div>
<div id="chapters"></div>

<script>
// 台本: video/src/scripts/v11-4-2.ts と同じ内容
const S = {
  requirement: "V11.4.2", level: 2, chapter: "V11 暗号",
  hook: { title: "そのパスワード保存、\nSHA-256 で\n済ませていませんか？", sub: "DB が漏れた瞬間に、総当たりが始まります" },
  ng: { caption: "❌ よくある NG", color: "var(--bad)", lines: [
    ["import hashlib"], [""], ["def save_password(password: str) -> str:"],
    ["    # 高速ハッシュ・ソルトなし", "bad"], ["    return hashlib.sha256(", "bad"],
    ["        password.encode()", "bad"], ["    ).hexdigest()", "bad"] ],
    note: "「ハッシュ化しているから安全」…ではありません" },
  why: { title: "なぜ危ない？", points: [
    "SHA-256 は「速い」のが仕事。GPU なら毎秒数十億回試せる",
    "ソルトなし → 同じパスワードは同じハッシュ。まとめて破られる",
    "漏えいした DB は、攻撃者の手元で時間無制限に解析される" ] },
  requirementText: "パスワードは、承認済みで計算コストの高い\nパスワードハッシュ関数（KDF）で保存し、\nパラメータは最新のガイダンスに合わせる",
  ok: { caption: "✅ OK：argon2id", color: "var(--good)", lines: [
    ["from argon2 import PasswordHasher"], [""], ["ph = PasswordHasher(", "good"],
    ["    time_cost=1, memory_cost=47104,", "good"], ["    parallelism=1)", "good"], [""],
    ["stored = ph.hash(password)  # ソルトは自動"], ["ph.verify(stored, password) # 不一致は例外"] ],
    note: "「わざと遅く・メモリを食う」ことで総当たりを割に合わなくする" },
  checkpoints: { title: "パラメータの目安", items: [
    "argon2id：m ≥ 46 MiB, t = 1, p = 1", "bcrypt：cost ≥ 10",
    "PBKDF2-HMAC-SHA-256：600,000 回以上", "自前で sha256 を何回も回さない" ] },
  quiz: { question: "Q. パスワード保存に\n使ってはいけないのは？", choices: ["argon2id", "bcrypt", "SHA-256 一回"], answer: 2,
    explanation: "高速ハッシュは「パスワードハッシュ関数」ではありません" },
};

const FPS = 30;
const SCENES = [
  ["hook", "つかみ", 3.5], ["ng", "NG", 7.5], ["why", "なぜ危ない", 8], ["requirement", "要件", 6],
  ["ok", "OK", 9], ["checkpoints", "目安", 7], ["quiz", "クイズ", 7], ["outro", "出典", 3],
].map(([key, label, sec]) => ({ key, label, frames: Math.round(sec * FPS) }));
let acc = 0; SCENES.forEach(s => { s.start = acc; acc += s.frames; });
const TOTAL = acc;

const esc = t => t.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const KW = new Set(["import", "from", "def", "return", "if", "else"]);
function hl(line) {
  const re = /(#.*$)|("[^"]*"|'[^']*')|(\b\d[\d_]*\b)|([A-Za-z_]\w*)|([\s\S])/g;
  let out = "", m;
  while ((m = re.exec(line))) {
    const [w, cm, str, num, id] = m;
    if (cm) out += `<span class="cm">${esc(w)}</span>`;
    else if (str) out += `<span class="str">${esc(w)}</span>`;
    else if (num) out += `<span class="num">${w}</span>`;
    else if (id) out += KW.has(id) ? `<span class="kw">${w}</span>` : line[re.lastIndex] === "(" ? `<span class="fn">${w}</span>` : w;
    else out += esc(w);
  }
  return out;
}
const br = t => esc(t).replace(/\n/g, "<br>");
// data-d = 登場フレーム（下からふわっと）, data-l = コード行のフェード
const codeScene = c => `
  <div class="cap" data-d="0" style="color:${c.color}">${c.caption}</div>
  <div class="code">${c.lines.map(([t, k], i) => `<div class="${k || ""}" data-l="${10 + i * 6}">${hl(t)}</div>`).join("")}</div>
  <div class="note" data-d="${10 + c.lines.length * 6 + 20}">${c.note}</div>`;

const BUILD = {
  hook: () => `
    <div id="hookTitle" data-d="0" style="font-size:92px;font-weight:900;line-height:1.3">${br(S.hook.title)}</div>
    <div data-d="25" style="font-size:46px;font-weight:700;color:var(--bad)">⚠ ${S.hook.sub}</div>`,
  ng: () => codeScene(S.ng),
  why: () => `
    <div class="cap" data-d="0" style="color:var(--warn)">${S.why.title}</div>
    <div class="counter" data-d="5" id="counter">0 回試行</div>
    ${S.why.points.map((p, i) => `<div class="point" data-d="${30 + i * 45}"><span>●</span><span>${p}</span></div>`).join("")}`,
  requirement: () => `
    <div style="font-size:44px;color:var(--muted);font-weight:700">OWASP ASVS 5.0 の要件</div>
    <div class="req-id" id="pop"><div class="id">${S.requirement}</div><div class="lv">L${S.level}</div></div>
    <div data-d="20" style="font-size:50px;font-weight:700;line-height:1.6">${br(S.requirementText)}</div>
    <div data-d="40" style="font-size:36px;color:var(--muted)">${S.chapter}</div>`,
  ok: () => codeScene(S.ok),
  checkpoints: () => `
    <div class="cap" data-d="0" style="color:var(--accent)">${S.checkpoints.title}</div>
    ${S.checkpoints.items.map((t, i) => `<div class="check" data-d="${15 + i * 30}"><span>✓</span><span>${t}</span></div>`).join("")}`,
  quiz: () => `
    <div data-d="0" style="font-size:70px;font-weight:900;line-height:1.35">${br(S.quiz.question)}</div>
    ${S.quiz.choices.map((c, i) => `<div class="choice" data-c="${i}" data-d="${15 + i * 10}">${"ABC"[i]}. ${c}</div>`).join("")}
    <div id="quizMsg" style="font-size:44px;font-weight:700;min-height:70px"></div>`,
  outro: () => `
    <div data-d="0" style="font-size:64px;font-weight:900;line-height:1.4">続きはリポジトリの<br>解説とハンズオンで</div>
    <div data-d="10" style="font-family:var(--mono);font-size:34px;color:var(--accent)">github.com/kazumasamatsumoto/<br>owasp-asvs-study</div>
    <div data-d="20" style="font-size:30px;color:var(--muted);line-height:1.6">出典: OWASP Application Security Verification Standard 5.0.0 (${S.requirement})<br>CC BY-SA 4.0 / この動画も CC BY-SA 4.0 で公開</div>`,
};

const stage = document.getElementById("stage");
stage.innerHTML = `<div class="scene" id="scene"></div><div class="progress" id="bar"></div>
  <div class="header"><b>1 分 ASVS</b><span>|</span><span>${S.requirement}</span></div>`;
const sceneEl = document.getElementById("scene");
const bar = document.getElementById("bar");

const ease = f => (f <= 0 ? 0 : 1 - Math.exp(-f / 5) * (1 + f / 5)); // spring(damping:200) に近い立ち上がり
const clamp01 = x => Math.max(0, Math.min(1, x));
let current = null;

function render(frame) {
  const sc = SCENES.find(s => frame < s.start + s.frames) || SCENES[SCENES.length - 1];
  const f = frame - sc.start;
  if (current !== sc.key) { current = sc.key; sceneEl.innerHTML = BUILD[sc.key](); }
  sceneEl.querySelectorAll("[data-d]").forEach(el => {
    const s = ease(f - Number(el.dataset.d));
    el.style.opacity = s; el.style.transform = `translateY(${(1 - s) * 40}px)`;
  });
  sceneEl.querySelectorAll("[data-l]").forEach(el => { el.style.opacity = clamp01((f - Number(el.dataset.l)) / 8); });
  if (sc.key === "hook") {
    const t = document.getElementById("hookTitle");
    t.style.marginLeft = (f < 20 ? Math.sin(f * 2.2) * (20 - f) * 0.6 : 0) + "px";
  }
  if (sc.key === "why") {
    const n = Math.floor(clamp01(f / 200) * 9870000000);
    document.getElementById("counter").textContent = n.toLocaleString("en-US") + " 回試行";
  }
  if (sc.key === "requirement") {
    const x = f / 5, pop = f <= 0 ? 0 : 1 - Math.exp(-x * 0.9) * Math.cos(x * 1.6);
    document.getElementById("pop").style.transform = `scale(${pop})`;
  }
  if (sc.key === "quiz") {
    const revealAt = sc.frames - Math.round(2.5 * FPS), revealed = f >= revealAt;
    sceneEl.querySelectorAll("[data-c]").forEach(el => {
      const ok = Number(el.dataset.c) === S.quiz.answer;
      el.classList.toggle("hit", revealed && ok); el.classList.toggle("dim", revealed && !ok);
    });
    const msg = document.getElementById("quizMsg");
    msg.style.color = revealed ? "var(--text)" : "var(--muted)";
    msg.textContent = revealed ? `正解は ${"ABC"[S.quiz.answer]}！ ${S.quiz.explanation}` : `考えてみてください… ${Math.ceil((revealAt - f) / FPS)}`;
  }
  bar.style.width = (frame / TOTAL) * 100 + "%";
  seek.value = frame;
  timeEl.textContent = `${(frame / FPS).toFixed(1)} / ${(TOTAL / FPS).toFixed(1)} 秒`;
  chapterBtns.forEach((b, i) => b.classList.toggle("on", SCENES[i] === sc));
}

// 縮小表示
const viewport = document.getElementById("viewport");
const fit = () => { stage.style.transform = `scale(${viewport.clientWidth / 1080})`; };
new ResizeObserver(fit).observe(viewport); fit();

// 再生コントロール
const seek = document.getElementById("seek"), timeEl = document.getElementById("time"), playBtn = document.getElementById("play");
seek.max = TOTAL - 1;
const chapters = document.getElementById("chapters");
const chapterBtns = SCENES.map(s => {
  const b = document.createElement("button"); b.type = "button"; b.textContent = s.label;
  b.onclick = () => go(s.start); chapters.appendChild(b); return b;
});
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let frame = 0, playing = !reduce, last = null;
const setPlaying = p => { playing = p; last = null; playBtn.textContent = p ? "⏸ 一時停止" : "▶ 再生"; };
const go = fr => { frame = Math.max(0, Math.min(TOTAL - 1, fr)); render(Math.floor(frame)); };
playBtn.onclick = () => { if (!playing && frame >= TOTAL - 1) frame = 0; setPlaying(!playing); };
document.getElementById("restart").onclick = () => { go(0); setPlaying(true); };
seek.oninput = () => { setPlaying(false); go(Number(seek.value)); };
setPlaying(playing);
function tick(ts) {
  if (playing) {
    if (last !== null) frame += ((ts - last) / 1000) * FPS;
    last = ts;
    if (frame >= TOTAL - 1) { frame = TOTAL - 1; setPlaying(false); }
    render(Math.floor(frame));
  }
  requestAnimationFrame(tick);
}
// 静止時でも内容が見えるよう、一時停止中は「要件」シーンの完成形を表示
if (!playing) go(SCENES[3].start + 60); else render(0);
requestAnimationFrame(tick);
</script>
