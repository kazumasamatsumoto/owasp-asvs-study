name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Labs (solutions must pass)
        run: python3 labs/run.py --solution
      - name: Checklists are up to date
        run: |
          python3 tools/generate_checklists.py
          git diff --exit-code -- checklists/
